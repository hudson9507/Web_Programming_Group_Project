<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <title>Slot Machine</title>
   <link rel="stylesheet" href="blackjackStyles.css">
    <script src="blackjackScript.js" defer></script>
</head>
<body>
    <header>      
        <div class="routets"><a href="payment.html">CREDIT CARD</a></div>
        <div class="routets"><a href="index.html">HOME</a></div>
        <div class="routets">Balance: <span id='balanceDisplay'></span></div>
    </header>
    <main>
        <h1>Blackjack</h1>
        <h3 id='balanceDisplay'></h3>
        <div class="game-container">
            <div class="dealer-section">
                <h2>Dealer's Hand</h2>
                <div id="dealer-cards" class="cards">
                    <img class='card' id='dealerCard1' src="public/img/blackjack/cardBackRed.png">
                    <img class='card' id='dealerCard2' src="public/img/blackjack/cardBackRed.png">
                </div>
                <p>Score: <p id="dealer-score"></p></p>
            </div>
            <div class="player-section">
                <h2>Your Hand</h2>
                <div id="player-cards" class="cards">
                    <img class='card' id='userCard1' src="public/img/blackjack/cardBackRed.png">
                    <img class='card' id='userCard2'src="public/img/blackjack/cardBackRed.png">
                </div>
                <p>Score: <p id="player-score"></p></p>
            </div>
        </div>
        <div class="controls">
            <input type="number" id="betAmount" placeholder="Enter your bet amount" min="1" />
            <button id="dealBtn">DEAL</button>
            <button id="hitBtn" disabled>HIT</button>
            <button id="standBtn" disabled>STAND</button>
        </div>
        <div id="message"></div>
    </main>
</body>
</html>
