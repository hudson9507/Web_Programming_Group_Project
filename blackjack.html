<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <!--Set page title and import stylesheets and scripts-->
   <title>Blackjack</title>
   <link rel="stylesheet" href="blackjackStyles.css">
    <script src="blackjackScript.js" defer></script>
</head>
<body>
    <!--header with flex children and appropriate classes-->
    <header>      
        <div class="routets"><a href="payment.html">CREDIT CARD</a></div>
        <div class="routets"><a href="index.html">HOME</a></div>
        <div class="routets">Balance: <span id='balanceDisplay'></span></div>
    </header>
    <main>
        <h1>BLACKJACK</h1>
        <div class="game-bubble">
            <!--contains the game-->
            <div class="game-container">
                <!--contains the dealers portion of the game-->
                <div class="dealer-section">
                    <h2>Dealer's Hand</h2>
                    <div id="dealer-cards" class="cards">
                        <img id='dealercard1' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='dealercard2' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='dealercard3' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='dealercard4' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='dealercard5' src="public/img/blackjack/cardBackRed.png" alt="card">
                    </div>
                    <p id="dealer-score">Score: 0</p>
                </div>
                <!--contains the players portion of the game-->
                <div class="player-section">
                    <h2>Your Hand</h2>
                    <div id="player-cards" class="cards">
                        <img id='usercard1' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='usercard2' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='usercard3' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='usercard4' src="public/img/blackjack/cardBackRed.png" alt="card">
                        <img id='usercard5' src="public/img/blackjack/cardBackRed.png" alt="card">
                    </div>
                    <p id="player-score">Score: 0</p>
                </div>
            </div>
            <!--controls for the user, these are enabled and disabled througout the match-->
            <div class="controls">
                <input type="number" id="betAmount" placeholder="Enter your bet amount" min="1" />
                <button id="dealBtn">DEAL</button>
                <button id="hitBtn" disabled>HIT</button>
                <button id="standBtn" disabled>STAND</button>
            </div>
            <!--message area to display game status and various game updates-->
            <div id="message"></div>
        </div>
    </main>
</body>
</html>
