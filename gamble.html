<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gambling Site</title>
        <link rel="stylesheet" href="gambleStyles.css">
        <script src="gambleScript.js" defer></script>
    </head>
    <body>
        <header>
            <div class="routets"><a href="payment.html">CREDIT CARD</a></div>
            <div class="routets"><a href="index.html">HOME</a></div>
            <div class="routets">Current Balance: <p id='balanceDisplay'></p></div>
        </header>
        <main>
            <table class="mainContent">
            <tr>
                <td class="tdimg" style="border-radius: 10px 0px 0px 0px;" colspan="1">
                    <div class="tdText">
                        <h2>Blackjack</h2>
                        <p>Try your luck against the dealer! Aim for 21 without going over.</p>
                        <button class="playBtn" onclick="window.location.href='blackjack.html'">Play Blackjack</button>
                    </div>
                </td>

                <td colspan="1" class='tdimg'>
                    <div class="tdText">
                        <h2>Roulette</h2>
                        <p>Place your bets on red or black, odd or even. Spin to win!</p>
                        <button class="playBtn" onclick="window.location.href='roulette.html'">Spin Roulette</button>
                    </div>
                </td>

                <td class="tdimg" style="border-radius: 0px 10px 0px 0px;" colspan="1">
                    <div class="tdText">
                        <h2>Slots</h2>
                        <p>Pull the lever and match symbols to win big prizes!</p>
                        <button class="playBtn" onclick="window.location.href='slots.html'">Play Slots</button>
                    </div>
                </td>
            </tr>
                <tr>
                    <td class="tdimg" style="border-radius: 0px 0px 0px 10px;" colspan="1">
                        <div class="blackjack">
                            <img src="public/img/blackjack/cardBackRed.png">
                            <img src="public/img/blackjack/cardBackRed.png">
                        </div>
                    </td>
                    <td colspan="1" class='tdimg'><div class="roulette"></div></td>
                    <td class="tdimg" style="border-radius: 0px 0px 10px 0px;" colspan="1"><div class='slots'><img src='public/img/slots/7.png'><img src='public/img/slots/7.png'><img src='public/img/slots/7.png'></div></td>
                </tr>
            </table>
        </main>
    </body>
</html>
