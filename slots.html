<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8" />
   <title>Slot Machine</title>
   <link rel="stylesheet" href="slotStyles.css">
</head>
<body>
   <h1>Slot Machine</h1>
   <div class="slot-container">
      <div class="slot"><img id="slot1" src="./public/img/slots/lemon.png"></div>
      <div class="slot"><img id="slot2" src="./public/img/slots/diamond.png"></div>
      <div class="slot"><img id="slot3" src="./public/img/slots/cherry.png"></div>
   </div>
   <input type="number" id="betAmount" placeholder="Enter your bet amount" min="1" />
   <button id="spinBtn">SPIN</button>
   <div id="message"></div>
   <script src="slotScript.js"></script>
</body>
</html>
