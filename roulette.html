<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <title>ROULETTE</title>
   <link rel="stylesheet" href="rouletteStyles.css">
</head>
<body>
   <h1>ROULETTE</h1>

   <div class="roulette-layout">
      <div class="wheel-section">
         <div class="pointer"></div>
         <div id="wheel" class="roulette-wheel"></div>
      </div>

      <div class="panels">
         <div class="bet-panel">
            <label for="betType">Choose your bet:</label>
            <select id="betType">
               <option value="">-- Select bet --</option>
               <option value="red">Red</option>
               <option value="black">Black</option>
               <option value="odd">Odd</option>
               <option value="even">Even</option>
            </select>
            <button id="spinButton">SPIN</button>
         </div>

         <div class="result-panel">
            <h2>Result</h2>
            <p id="resultNumber">Number: -</p>
            <p id="resultColor">Color: -</p>
            <p id="message"></p>
         </div>
      </div>
   </div>

   <script src="rouletteScript.js"></script>
</body>
</html>
